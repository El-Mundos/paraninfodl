[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paraninfodl"
version = "1.3.0"
description = "Download ebooks from ebooks.paraninfo.es as PDF"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "cryptography>=41.0.0",
    "img2pdf>=0.4.4",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/El-Mundos/paraninfodl"

[project.scripts]
paraninfodl = "paraninfodl:main"

[tool.setuptools]
py-modules = ["paraninfodl"]
include-package-data = true

[tool.setuptools.data-files]
"share/fish/vendor_completions.d" = ["completions/paraninfodl.fish"]
